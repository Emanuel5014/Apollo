# streamfork: build an Arch Linux package (pacman) of this branch with docker/archlinux.dockerfile
name: Build Arch Linux package

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

jobs:
  archlinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          # Unit tests are not maintained for Linux in Apollo: build and package only
          sed -i 's/^ENV _run_unit_tests=true/ENV _run_unit_tests=false/' docker/archlinux.dockerfile
          # gcc14 is no longer in the Arch repositories: build with the system gcc. With a newer gcc
          # than upstream tests, new warnings would fail the build, so don't treat them as errors.
          sed -i \
            -e 's/"gcc${_gcc_version}"/'"'"'gcc'"'"'/' \
            -e 's/export CC="gcc-${_gcc_version}"/export CC=gcc/' \
            -e 's/export CXX="g++-${_gcc_version}"/export CXX=g++/' \
            -e 's/-D BUILD_WERROR=ON/-D BUILD_WERROR=OFF/' \
            packaging/linux/Arch/PKGBUILD
          grep -nE "gcc|CC=|CXX=|WERROR" packaging/linux/Arch/PKGBUILD
          docker buildx build \
            --file docker/archlinux.dockerfile \
            --target sunshine \
            --build-arg BRANCH="${GITHUB_REF_NAME}" \
            --build-arg BUILD_VERSION="" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg CLONE_URL="https://github.com/${GITHUB_REPOSITORY}.git" \
            --tag apollo-arch \
            --load \
            .

      - name: Extract package
        run: |
          id=$(docker create apollo-arch)
          mkdir -p artifacts
          docker cp "$id:/artifacts/." artifacts/
          docker rm "$id"
          short=$(echo "${GITHUB_SHA}" | cut -c1-8)
          mv artifacts/sunshine.pkg.tar.zst "artifacts/apollo-streamfork-${short}-x86_64.pkg.tar.zst"
          mv artifacts/sunshine.pkg.tar.gz "artifacts/apollo-streamfork-${short}-PKGBUILD.tar.gz"
          ls -la artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-ArchLinux
          path: artifacts/
